<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookie — Historia 1.1 Activación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/activation.css" />
    <link rel="stylesheet" href="../css/consent.css" />
    <link rel="stylesheet" href="../css/plan.css" />
    <link rel="stylesheet" href="../css/payment.css" />
    <link rel="stylesheet" href="../css/subscription-summary.css" />
    <link rel="stylesheet" href="../css/code-activation.css" />
    <link rel="stylesheet" href="../css/profiling.css" />
    <link rel="stylesheet" href="../css/plan-3-1.css" />
  </head>
  <body>
    <script>
      if (new URLSearchParams(window.location.search).get('embed') === 'scanner-sheet') {
        document.documentElement.classList.add('is-embed-demo');
      }
    </script>
    <div class="app-viewport">
      <div class="phone-shell" id="phone-shell">
        <div class="phone-shell__body">
          <!-- 1.1.1 — Splash (Figma 13057:955) -->
          <section
            class="screen screen--splash is-active"
            id="screen-splash"
            aria-label="Pantalla de inicio"
          >
            <button type="button" class="splash" id="splash-tap" aria-label="Continuar">
              <img class="splash__logo" id="splash-logo" src="" alt="" width="56" height="47" />
              <p class="splash__title" id="splash-title">Rookie</p>
            </button>
          </section>

          <!-- 1.1.2 — Walkthrough 1 (Figma 13060:2053) -->
          <section
            class="screen screen--walkthrough-1"
            id="screen-walkthrough-1"
            aria-label="Walkthrough — Empezar es lo difícil"
          >
            <div class="walkthrough-hero">
              <div class="walkthrough-hero__media" aria-hidden="true">
                <img class="walkthrough-hero__photo" id="walkthrough-hero-photo" src="" alt="" />
                <div class="walkthrough-hero__gradient"></div>
              </div>

              <header class="walkthrough-hero__brand">
                <div class="walkthrough-hero__logo" aria-label="Decathlon">
                  <img
                    class="walkthrough-hero__logo-mark"
                    id="walkthrough-logo-mark"
                    src=""
                    alt=""
                    width="33"
                    height="28"
                  />
                  <img
                    class="walkthrough-hero__logo-wordmark"
                    id="walkthrough-logo-wordmark"
                    src=""
                    alt=""
                    width="147"
                    height="20"
                  />
                </div>
              </header>

              <div class="walkthrough-hero__content">
                <h1 class="walkthrough-hero__title" id="walkthrough-title">
                  <span class="walkthrough-hero__title-line">Empezar es lo difícil</span>
                  <span class="walkthrough-hero__title-line">Por eso no lo haces solo</span>
                </h1>

                <button type="button" class="btn btn--primary walkthrough-hero__cta" id="walkthrough-cta">
                  Comenzar
                </button>

                <p class="walkthrough-hero__login">
                  <span id="walkthrough-login-prefix">¿Ya tienes cuenta?</span>
                  <a class="walkthrough-hero__login-link" id="walkthrough-login-link" href="#">Iniciar sesión</a>
                </p>
              </div>
            </div>
          </section>

          <!-- Walkthrough slides 2–6 y registro se montan desde activation-app.js -->
        </div>
      </div>
    </div>

    <script src="../js/figma-1-1-spec.js"></script>
    <script src="../js/figma-1-2-spec.js"></script>
    <script src="../js/figma-1-3-spec.js"></script>
    <script src="../js/barra-superior-back.js"></script>
    <script src="../js/activation-app.js"></script>
    <script src="../js/consent-app.js"></script>
    <script src="../js/subscription-summary.js"></script>
    <script src="../js/plan-app.js"></script>
    <script src="../js/payment-app.js"></script>
    <script src="../js/code-activation-app.js"></script>
    <script src="../js/figma-1-4-spec.js"></script>
    <script src="../js/figma-3-1-spec.js"></script>
    <script src="../js/profiling-stepper-anim.js"></script>
    <script src="../js/profiling-app.js"></script>
  </body>
</html>
