<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookie — Reset demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        font-family: system-ui, sans-serif;
        color: #111;
        text-align: center;
      }
      p {
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <p id="reset-message">Borrando datos de la demo…</p>
    <script>
      /* Reset completo del prototipo antes de una demo — borra todo lo que
         sessionStorage haya acumulado (perfil, motivaciones, mentor elegido,
         cita, progreso de sesiones, etc.) y vuelve al arranque de la app.
         El prototipo entero solo usa sessionStorage (sin localStorage,
         cookies ni IndexedDB), así que esto es un reset completo. */
      try {
        sessionStorage.clear();
      } catch (_) {
        /* sessionStorage no disponible (modo privado, etc.) — no hay nada que borrar */
      }
      window.location.replace('../index.html');
    </script>
  </body>
</html>
