      }
    </style>

  <body>
    <main class="code-scanner-sheets-demo">
      <header class="code-scanner-sheets-demo__header">

        <p class="code-scanner-sheets-demo__subtitle">
          Historia 1.1 · Bottom sheet visible por defecto (excepto éxito) · Figma 13131:120018–120355
        </p>

      <div class="code-scanner-sheets-demo__grid">
        <section class="code-scanner-sheets-demo__item">

        <section class="code-scanner-sheets-demo__item">

          <iframe
            class="code-scanner-sheets-demo__frame"

            src="../../../activation/index.html?embed=scanner-sheet&v=8#code-scanner-screen-success"

        <section class="code-scanner-sheets-demo__item">
          <p class="code-scanner-sheets-demo__label">3 — Error: código no leído</p>

        </section>

        <section class="code-scanner-sheets-demo__item">
          <p class="code-scanner-sheets-demo__label">4 — Error: código ya utilizado</p>

        <section class="code-scanner-sheets-demo__item">
          <p class="code-scanner-sheets-demo__label">5 — Error: código no válido</p>
          <iframe
            class="code-scanner-sheets-demo__frame"
            title="Scanner código no válido"
            src="../../../activation/index.html?embed=scanner-sheet&v=8#code-scanner-screen-invalid"
