<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookie — Activar código</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/code-activation.css" />
  </head>
  <body>
    <div class="app-viewport">
      <div class="phone-shell phone-shell--code-bridge" id="phone-shell">
        <div class="phone-shell__body" id="code-bridge-root"></div>
      </div>
    </div>

    <script src="../js/figma-1-1-spec.js"></script>
    <script src="../js/barra-superior-back.js"></script>
    <script src="../js/code-activation-app.js"></script>
    <script>
      (function () {
        const root = document.getElementById('code-bridge-root');
        if (root && window.CodeActivationFlow) {
          root.innerHTML = window.CodeActivationFlow.createBridgeMarkup();
          document.getElementById('screen-code-bridge')?.classList.add('is-active');
          window.CodeActivationFlow.initBridge();
        }
      })();
    </script>
  </body>
</html>
