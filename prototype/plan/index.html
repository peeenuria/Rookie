<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookie — 1.3.1 Selección de plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/plan.css" />
    <link rel="stylesheet" href="../css/subscription-summary.css" />
  </head>
  <body>
    <div class="app-viewport">
      <div class="phone-shell phone-shell--plan" id="phone-shell">
        <div class="phone-shell__body">
          <section
            class="screen screen--plan-selection is-active"
            id="screen-plan-selection"
            aria-label="Selección de plan"
          >
            <nav
              class="BarraSuperiorBack BarraSuperiorBack--predeterminada"
              data-barra-superior-back
              data-variant="predeterminada"
              aria-label="Navegación"
            >
              <button
                type="button"
                class="BarraSuperiorBack__btn"
                id="plan-selection-back"
                aria-label="Volver"
                data-barra-superior-back-btn
              >
                <span class="BarraSuperiorBack__hit" aria-hidden="true"></span>
                <svg class="BarraSuperiorBack__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 5L5 12L12 19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </nav>
            <div class="plan-selection">
              <header class="plan-selection__header">
                <h1 class="plan-selection__title" id="plan-selection-title">Activa tu cuenta Rookie</h1>
                <p class="plan-selection__subtitle" id="plan-selection-subtitle"></p>
              </header>

              <div
                class="plan-selection__cards"
                id="plan-selection-cards"
                role="radiogroup"
                aria-label="Tipo de suscripción"
              ></div>

              <footer class="plan-selection__footer">
                <div
                  class="subscription-summary"
                  id="plan-selection-summary"
                  aria-live="polite"
                  aria-atomic="true"
                ></div>
                <button
                  type="button"
                  class="btn btn--primary plan-selection__submit btn--disabled"
                  id="plan-selection-submit"
                  disabled
                >
                  Activar suscripción
                </button>
                <p class="plan-selection__note" id="plan-selection-note"></p>
              </footer>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="../js/figma-1-3-spec.js"></script>
    <script src="../js/barra-superior-back.js"></script>
    <script src="../js/subscription-summary.js"></script>
    <script src="../js/plan-app.js"></script>
  </body>
</html>
