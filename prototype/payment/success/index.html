<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookie — Cuenta activada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" />
    <link rel="stylesheet" href="../../css/tokens.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/payment.css" />
  </head>
  <body>
    <div class="app-viewport">
      <div class="phone-shell phone-shell--payment-success" id="phone-shell">
        <div class="phone-shell__body" id="payment-success-root"></div>
      </div>
    </div>

    <script src="../../js/figma-1-1-spec.js"></script>
    <script src="../../js/figma-1-3-spec.js"></script>
    <script src="../../js/payment-app.js"></script>
    <script>
      (function () {
        const paymentValidated = sessionStorage.getItem('rookie-payment-validated') === 'true';
        const codeValidated = sessionStorage.getItem('rookie-code-validated') === 'true';
        if (!paymentValidated && !codeValidated) {
          window.location.replace('../../code/index.html');
          return;
        }

        const root = document.getElementById('payment-success-root');
        if (root && window.PaymentFlow) {
          root.innerHTML = window.PaymentFlow.createSuccessMarkup();
          document.getElementById('screen-payment-success')?.classList.add('is-active');
          window.PaymentFlow.initSuccess();
        }
      })();
    </script>
  </body>
</html>
