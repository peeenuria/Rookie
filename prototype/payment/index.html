<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookie — Método de pago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/payment.css" />
    <link rel="stylesheet" href="../css/subscription-summary.css" />
  </head>
  <body>
    <div class="app-viewport">
      <div class="phone-shell phone-shell--payment" id="phone-shell">
        <div class="phone-shell__body" id="payment-root"></div>
      </div>
    </div>

    <script src="../js/figma-1-3-spec.js"></script>
    <script src="../js/subscription-summary.js"></script>
    <script src="../js/payment-app.js"></script>
    <script>
      (function () {
        const root = document.getElementById('payment-root');
        if (!root || !window.PaymentFlow) return;

        if (!sessionStorage.getItem('rookie-selected-plan')) {
          sessionStorage.setItem('rookie-selected-plan', 'monthly');
        }

        root.innerHTML =
          window.PaymentFlow.createMethodMarkup() +
          window.PaymentFlow.createGatewayMarkup() +
          window.PaymentFlow.createSuccessMarkup();

        window.PaymentFlow.initMethod();
        window.PaymentFlow.initGateway();
        window.PaymentFlow.initSuccess();

        function showFromHash() {
          const hash = window.location.hash.replace(/^#/, '') || 'payment-method';
          const map = {
            'payment-method': 'screen-payment-method',
            'payment-gateway': 'screen-payment-gateway',
            'payment-success': 'screen-payment-success',
          };
          const activeId = map[hash] || 'screen-payment-method';
          root.querySelectorAll('.screen').forEach((section) => {
            section.classList.toggle('is-active', section.id === activeId);
          });
          if (hash === 'payment-method') {
            window.PaymentFlow.refreshMethodScreen?.();
            document.title = 'Rookie — Método de pago';
          } else if (hash === 'payment-gateway') {
            window.PaymentFlow.refreshSummary?.();
            document.title = 'Rookie — Pasarela de pago';
          } else if (hash === 'payment-success') {
            document.title = 'Rookie — Cuenta activada';
          }
        }

        if (!window.location.hash) {
          window.location.hash = 'payment-method';
        }

        showFromHash();
        window.addEventListener('hashchange', showFromHash);
      })();
    </script>
  </body>
</html>
